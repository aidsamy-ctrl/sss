
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma première page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            padding: 50px;
            background: #1f2937;
            border-radius: 20px;
            box-shadow: 0 10px 40px #0005;
            max-width: 500px;
            margin: 20px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 15px;
            color: #a78bfa;
        }

        p {
            color: #d1d5db;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        button {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        button:hover {
            background: #6d28d9;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Bienvenue ! 🚀</h1>

        <p>
            Voici ma première page HTML.
            Je découvre le développement web avec VS Code et GitHub !
        </p>

        <button onclick="direBonjour()">
            Clique ici
        </button>
    </div>

    <script>
        function direBonjour() {
            alert("Bravo ! Ton site fonctionne 🎉");
        }
    </script>

</body>
</html>
